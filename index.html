<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1769e0"><title>مبيعاتي</title><style>
:root{--primary:#1769e0;--bg:#f3f7fd;--ink:#17243b;--card:#fff;--line:#dce5f2}*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:var(--bg);color:var(--ink)}header{background:var(--primary);color:#fff;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}header strong{font-size:24px}header small{display:block;opacity:.9;margin-top:4px}.wrap{max-width:1200px;margin:auto;padding:14px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.tabs button{flex:1;min-width:105px}button{border:0;border-radius:10px;padding:11px 14px;background:var(--primary);color:#fff;font-size:15px;cursor:pointer;margin:3px}button.secondary{background:#e8f0ff;color:#174b9c}button.danger{background:#b42318}button:disabled{opacity:.45}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px;margin:10px 0;box-shadow:0 3px 12px #16345a0a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.stats{font-size:26px;font-weight:bold;color:var(--primary);margin-top:8px}h2{font-size:19px;margin:0 0 12px;color:var(--primary)}h3{font-size:16px}input,select,textarea{width:100%;padding:11px;margin:5px 0 10px;border:1px solid #cbd6e6;border-radius:9px;font:inherit;background:#fff;color:#17243b}label{font-size:14px;font-weight:bold}table{border-collapse:collapse;width:100%;min-width:600px}th,td{text-align:right;border-bottom:1px solid var(--line);padding:10px}th{background:#edf4ff}.tablewrap{overflow:auto}.muted{color:#66758b;font-size:13px}.hide{display:none!important}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1;min-width:130px}.product{border:1px solid var(--line);padding:10px;border-radius:10px;margin:7px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{background:#fff0d5;color:#8a5300;padding:4px 8px;border-radius:20px;font-size:12px}.ok{color:#087443}.low{color:#b42318}.loginbox{max-width:420px;margin:5vh auto;text-align:center}.logo{font-size:34px;color:var(--primary);font-weight:bold}.loginlogo{width:132px;height:132px;object-fit:contain;display:block;margin:0 auto 8px;border-radius:24px}.rolepick{display:flex;gap:8px;margin:12px 0}.rolepick button{flex:1;margin:0}.rolepick button.selected{outline:3px solid #9fc4ff;background:#0d4eb8}.notice{background:#fff8e6;border:1px solid #f2d28b;padding:10px;border-radius:9px}.foot{font-size:12px;color:#748096;text-align:center;padding:20px}@media(min-width:850px){.posgrid{display:grid;grid-template-columns:1.2fr 1fr;gap:12px}}@media(max-width:600px){header strong{font-size:21px}.wrap{padding:9px}.tabs button{min-width:calc(33% - 8px);font-size:13px;padding:10px 5px}.card{padding:12px}table{min-width:540px}}
</style></head><body><header><div><strong id="brand">مبيعاتي</strong><small id="subtitle">إدارة البيع والمخزون والحسابات</small></div><div id="headuser" class="muted" style="color:white"></div></header><main class="wrap"><section id="login" class="card loginbox"><img class="loginlogo" src="icon-512.png" alt="شعار مبيعاتي"><div class="logo">مبيعاتي</div><p class="muted">سجّل الدخول للمتابعة</p><div class="rolepick"><button id="roleManager" class="selected" onclick="chooseRole('مدير')">حساب المدير</button><button id="roleEmployee" class="secondary" onclick="chooseRole('موظف')">حساب الموظفين</button></div><label style="display:block;text-align:right">اسم المستخدم</label><input id="lu" value="admin" autocomplete="username"><label style="display:block;text-align:right">كلمة المرور</label><input id="lp" type="password" value="admin123" autocomplete="current-password"><label style="display:block;text-align:right;font-weight:normal"><input id="showpass" type="checkbox" style="width:auto"> إظهار كلمة المرور</label><button onclick="login()" style="width:100%">دخول</button><p id="loginhint" class="muted">دخول المدير الافتراضي: admin / admin123 — غيّر كلمة المرور من الإعدادات.</p></section><section id="app" class="hide"><nav class="tabs"><button onclick="page('home')">الرئيسية</button><button onclick="page('sales')">البيع والكاشير</button><button onclick="page('products')">المنتجات والمخزون</button><button onclick="page('changes')">طلبات المخزون</button><button onclick="page('returns')">المرتجعات والتالف</button><button onclick="page('customers')">العملاء والديون</button><button onclick="page('expenses')">المصروفات</button><button onclick="page('reports')">التقارير</button><button onclick="page('settings')">الإعدادات</button></nav><div id="content"></div><button class="secondary" onclick="logout()">تسجيل الخروج</button></section><div class="foot">النسخة المحلية تحفظ البيانات على هذا الجهاز فقط. استخدم النسخ الاحتياطي بانتظام.</div></main>
<script>
const KEY='pos_offline_arabic_v1';let D;try{D=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){D=null}if(!D)D={users:[{u:'admin',p:'admin123',r:'مدير'}],products:[],sales:[],customers:[],expenses:[],id:1};D.users ||= [{u:'admin',p:'admin123',r:'مدير'}];D.products ||= [];D.sales ||= [];D.customers ||= [];D.expenses ||= [];D.requests ||= [];D.moves ||= [];D.returns ||= [];D.settings ||= {name:'مبيعاتي',color:'#1769e0',lang:'ar',low:5};let me=null,cart=[],loginRole='مدير';
function $(x){return document.getElementById(x)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){localStorage.setItem(KEY,JSON.stringify(D))}function isManager(){return me&&me.r==='مدير'}function money(n){return (Number(n)||0).toLocaleString('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2})+' ج.م'}function stamp(){return new Date().toLocaleString('ar-EG')}function logMove(p,before,after,reason){D.moves.push({name:p.n,before,after,diff:after-before,reason,date:stamp(),user:me.u})}function applyStyle(){document.documentElement.style.setProperty('--primary',D.settings.color||'#1769e0');$('brand').textContent=D.settings.name||'مبيعاتي';document.title=D.settings.name||'مبيعاتي';document.documentElement.lang=D.settings.lang||'ar';document.documentElement.dir=(D.settings.lang==='en'?'ltr':'rtl')}
$('showpass').onchange=()=> $('lp').type=$('showpass').checked?'text':'password';function chooseRole(r){loginRole=r;$('roleManager').classList.toggle('selected',r==='مدير');$('roleManager').classList.toggle('secondary',r!=='مدير');$('roleEmployee').classList.toggle('selected',r==='موظف');$('roleEmployee').classList.toggle('secondary',r!=='موظف');if(r==='مدير'){$('lu').value='admin';$('lp').value='admin123';$('loginhint').textContent='دخول المدير الافتراضي: admin / admin123 — غيّر كلمة المرور من الإعدادات.'}else{$('lu').value='';$('lp').value='';$('loginhint').textContent='اكتب اسم المستخدم وكلمة المرور الخاصة بحساب الموظف.'}}function login(){me=D.users.find(x=>x.u===$('lu').value.trim()&&x.p===$('lp').value&&x.r===loginRole);if(!me)return alert('بيانات الدخول غير صحيحة أو الحساب ليس من نوع '+loginRole);$('login').classList.add('hide');$('app').classList.remove('hide');$('headuser').textContent=me.u+' — '+me.r;applyStyle();page('home')}function logout(){me=null;cart=[];$('app').classList.add('hide');$('login').classList.remove('hide');$('lp').value=''}function page(n){if(!me)return;let c=$('content');({home, sales, products, changes, returns:returnsPage, customers, expenses, reports, settings}[n]||home)(c)}
function home(c){let today=new Date().toLocaleDateString('en-CA'),ss=D.sales.filter(s=>new Date(s.ts||Date.now()).toLocaleDateString('en-CA')===today),sum=ss.reduce((a,s)=>a+s.total,0),low=D.products.filter(p=>!p.archived&&p.q<=Number(D.settings.low||5));c.innerHTML=`<div class="grid"><div class="card">مبيعات اليوم<div class="stats">${money(sum)}</div></div><div class="card">عدد فواتير اليوم<div class="stats">${ss.length}</div></div><div class="card">عدد المنتجات<div class="stats">${D.products.filter(p=>!p.archived).length}</div></div><div class="card">منتجات منخفضة المخزون<div class="stats">${low.length}</div></div></div><div class="card"><h2>اختصارات سريعة</h2><button onclick="page('sales')">فاتورة جديدة</button><button onclick="page('products')">إضافة منتج</button><button onclick="page('reports')">التقارير</button></div><div class="card"><h2>تنبيه المخزون</h2>${low.map(p=>`<div class="product"><span>${esc(p.n)}</span><span class="low">المتبقي ${p.q}</span></div>`).join('')||'<p class="ok">لا توجد منتجات منخفضة المخزون.</p>'}</div><div class="card"><h2>آخر الفواتير</h2>${D.sales.slice(-5).reverse().map(s=>`<div class="product">فاتورة #${s.id} — ${esc(s.items?.map(i=>i.n).join('، ')||s.n)} <b>${money(s.total)}</b></div>`).join('')||'لا توجد فواتير حتى الآن.'}</div>`}
function products(c){c.innerHTML=`<div class="card"><h2>إضافة منتج</h2><div class="row"><div><label>اسم المنتج</label><input id="pn" placeholder="اسم المنتج"></div><div><label>الباركود (اختياري)</label><input id="pb" placeholder="رقم الباركود"></div></div><div class="row"><div><label>سعر البيع</label><input id="pp" type="number" min="0" step=".01"></div><div><label>سعر الشراء</label><input id="pc" type="number" min="0" step=".01"></div><div><label>الكمية</label><input id="pq" type="number" min="0" step="1" value="0"></div></div><div class="row"><div><label>حد التنبيه للمخزون</label><input id="pl" type="number" min="0" value="${Number(D.settings.low||5)}"></div><div><label>صورة المنتج (اختياري)</label><input id="pi" type="file" accept="image/*"></div></div><button onclick="addProduct()">حفظ المنتج</button><p class="muted">لو الباركود موجود بالفعل، سيتم إضافة الكمية للمنتج الموجود بدل إنشاء نسخة مكررة.</p></div><div class="card"><h2>المخزون الحالي</h2><input id="psearch" placeholder="بحث بالاسم أو الباركود" oninput="filterProducts()"><div id="plist">${productRows()}</div></div><div class="card"><h2>سجل حركات المخزون</h2><div class="tablewrap"><table><thead><tr><th>المنتج</th><th>قبل</th><th>بعد</th><th>الفرق</th><th>السبب</th><th>التاريخ</th><th>المستخدم</th></tr></thead><tbody>${D.moves.slice().reverse().slice(0,50).map(m=>`<tr><td>${esc(m.name)}</td><td>${m.before}</td><td>${m.after}</td><td>${m.diff>0?'+':''}${m.diff}</td><td>${esc(m.reason)}</td><td>${esc(m.date)}</td><td>${esc(m.user)}</td></tr>`).join('')||'<tr><td colspan="7">لا توجد حركات مسجلة.</td></tr>'}</tbody></table></div></div>`}
function productRows(filter=''){return `<div class="tablewrap"><table><thead><tr><th>المنتج</th><th>الباركود</th><th>بيع</th><th>شراء</th><th>الكمية</th><th>القيمة بسعر الشراء</th><th>الإجراء</th></tr></thead><tbody>${D.products.filter(p=>!p.archived&&(`${p.n} ${p.bar||''}`).toLowerCase().includes(filter.toLowerCase())).map(p=>`<tr><td>${p.img?`<img src="${p.img}" alt="" style="width:32px;height:32px;object-fit:cover;vertical-align:middle;border-radius:5px"> `:''}${esc(p.n)}</td><td>${esc(p.bar||'—')}</td><td>${money(p.price)}</td><td>${money(p.cost)}</td><td class="${p.q<=Number(p.low??D.settings.low??5)?'low':''}">${p.q}</td><td>${money(p.q*p.cost)}</td><td><button class="secondary" onclick="editP(${p.id})">تعديل</button>${isManager()?`<button class="secondary" onclick="requestStock(${p.id})">طلب تعديل كمية</button><button class="danger" onclick="archiveP(${p.id})">أرشفة</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7">لا توجد منتجات مطابقة.</td></tr>'}</tbody></table></div>`}function filterProducts(){$('plist').innerHTML=productRows($('psearch').value)}
function addProduct(){let n=$('pn').value.trim(),bar=$('pb').value.trim(),price=Number($('pp').value),cost=Number($('pc').value),q=Number($('pq').value),low=Number($('pl').value);if(!n||$('pp').value===''||$('pc').value===''||!Number.isInteger(q)||q<0||price<0||cost<0||low<0)return alert('راجع بيانات المنتج.');let existing=bar&&D.products.find(p=>p.bar===bar&&!p.archived);if(existing){let before=existing.q;existing.q+=q;existing.price=price;existing.cost=cost;logMove(existing,before,existing.q,'إضافة كمية عبر باركود مكرر');save();page('products');return alert('الباركود موجود؛ تمت إضافة الكمية للمنتج الحالي.')}let file=$('pi').files[0];const finish=img=>{let p={id:D.id++,n,bar,price,cost,q,low,img,archived:false};D.products.push(p);logMove(p,0,q,'إضافة منتج');save();page('products')};if(file){if(file.size>700000)return alert('حجم الصورة كبير؛ اختر صورة أقل من 700 كيلوبايت.');let r=new FileReader();r.onload=()=>finish(r.result);r.readAsDataURL(file)}else finish('')}
function editP(id){if(!isManager())return alert('تعديل بيانات المنتج متاح للمدير فقط.');let p=D.products.find(x=>x.id===id);if(!p)return;let n=prompt('اسم المنتج',p.n);if(n===null)return;let price=prompt('سعر البيع',p.price),cost=prompt('سعر الشراء',p.cost);if(price===null||cost===null||!n.trim()||!Number.isFinite(+price)||!Number.isFinite(+cost)||+price<0||+cost<0)return alert('بيانات غير صحيحة.');p.n=n.trim();p.price=+price;p.cost=+cost;save();page('products')}function archiveP(id){if(!isManager())return;let p=D.products.find(x=>x.id===id);if(confirm('أرشفة المنتج؟ سيختفي من البيع وستظل الفواتير القديمة محفوظة.')){p.archived=true;save();page('products')}}
function sales(c){c.innerHTML=`<div class="posgrid"><div class="card"><h2>اختيار المنتجات</h2><input id="ssearch" placeholder="ابحث بالاسم أو امسح الباركود" oninput="renderProductPick()"><div id="picklist">${pickRows()}</div></div><div class="card"><h2>الفاتورة الحالية</h2><div id="cartview">${cartView()}</div><label>خصم بالنسبة المئوية (%)</label><input id="disc" type="number" min="0" max="100" value="0" oninput="updateTotals()"><div class="row"><div><label>طريقة الدفع</label><select id="pay"><option>نقدي</option><option>بطاقة</option><option>محفظة إلكترونية</option><option>آجل</option></select></div><div><label>المبلغ المدفوع</label><input id="paid" type="number" min="0" value="0" oninput="updateTotals()"></div></div><label>اسم العميل (اختياري)</label><input id="scustomer" placeholder="اسم العميل"><div id="totals"></div><button onclick="completeSale()">إتمام البيع</button><button class="secondary" onclick="cart=[];page('sales')">تفريغ الفاتورة</button></div></div><div class="card"><h2>سجل الفواتير</h2>${D.sales.slice().reverse().slice(0,30).map(s=>`<div class="product"><span>فاتورة #${s.id} · ${esc(s.date)}<br>${esc(s.items?.map(i=>i.n+' × '+i.q).join('، ')||s.n)}</span><b>${money(s.total)}</b><button class="secondary" onclick="printSale(${s.id})">طباعة</button></div>`).join('')||'لا توجد فواتير.'}</div>`;updateTotals()}
function pickRows(filter=''){return D.products.filter(p=>!p.archived&&p.n.toLowerCase().includes(filter.toLowerCase())||(!p.archived&&p.bar&&p.bar.includes(filter))).map(p=>`<div class="product"><span><b>${esc(p.n)}</b><br>${money(p.price)} · المتاح ${p.q}</span><button onclick="addCart(${p.id})" ${p.q<1?'disabled':''}>إضافة</button></div>`).join('')||'<p class="muted">لا توجد منتجات.</p>'}function renderProductPick(){$('picklist').innerHTML=pickRows($('ssearch').value)}function addCart(id){let p=D.products.find(x=>x.id===id),line=cart.find(x=>x.id===id);if(!p||p.q<1)return alert('الكمية غير متاحة');if(line&&line.q>=p.q)return alert('لا توجد كمية إضافية متاحة');if(line)line.q++;else cart.push({id:p.id,n:p.n,price:p.price,cost:p.cost,q:1});$('cartview').innerHTML=cartView();updateTotals()}function cartView(){return cart.map(i=>`<div class="product"><span>${esc(i.n)}<br>${money(i.price)} × ${i.q}</span><span><button class="secondary" onclick="cartQty(${i.id},-1)">−</button><button class="secondary" onclick="cartQty(${i.id},1)">+</button><button class="danger" onclick="cart=cart.filter(x=>x.id!==${i.id});page('sales')">×</button></span></div>`).join('')||'<p class="muted">أضف منتجات للفاتورة.</p>'}function cartQty(id,d){let l=cart.find(x=>x.id===id),p=D.products.find(x=>x.id===id);if(!l)return;if(d>0&&l.q>=p.q)return alert('الكمية غير متاحة');l.q+=d;if(l.q<=0)cart=cart.filter(x=>x.id!==id);$('cartview').innerHTML=cartView();updateTotals()}function calc(){let sub=cart.reduce((a,x)=>a+x.price*x.q,0),pct=Math.min(100,Math.max(0,Number($('disc')?.value)||0)),discount=sub*pct/100,total=sub-discount,paid=Number($('paid')?.value)||0;return{sub,pct,discount,total,paid,change:Math.max(0,paid-total),due:Math.max(0,total-paid)}}function updateTotals(){if(!$('totals'))return;let t=calc();$('totals').innerHTML=`<p>الإجمالي قبل الخصم: <b>${money(t.sub)}</b></p><p>قيمة الخصم: <b>${money(t.discount)}</b></p><h3>الإجمالي المطلوب: ${money(t.total)}</h3><p>الباقي للعميل: <b>${money(t.change)}</b> · المتبقي على العميل: <b>${money(t.due)}</b></p>`}function completeSale(){if(!cart.length)return alert('أضف منتجًا أولًا.');let t=calc();for(let i of cart){let p=D.products.find(x=>x.id===i.id);if(!p||p.q<i.q)return alert('المخزون تغير؛ راجع الكميات.')}let customer=$('scustomer').value.trim(),pay=$('pay').value;if(pay!=='آجل'&&t.paid<t.total&&!confirm('المبلغ المدفوع أقل من الإجمالي. هل تريد تسجيل المتبقي كدين؟'))return;let s={id:D.id++,items:cart.map(x=>({...x})),n:cart.map(x=>x.n).join('، '),q:cart.reduce((a,x)=>a+x.q,0),subtotal:t.sub,discountPct:t.pct,discount:t.discount,total:t.total,paid:t.paid,change:t.change,due:t.due,method:pay,customer,date:stamp(),ts:Date.now(),user:me.u};cart.forEach(i=>{let p=D.products.find(x=>x.id===i.id),b=p.q;p.q-=i.q;logMove(p,b,p.q,'بيع فاتورة #'+s.id)});D.sales.push(s);if(customer&&(t.due>0||pay==='آجل')){let x=D.customers.find(x=>x.n===customer);if(x)x.b+=t.due||t.total;else D.customers.push({n:customer,b:t.due||t.total})}save();cart=[];page('sales');alert('تم حفظ الفاتورة رقم '+s.id);if(confirm('هل تريد طباعة الفاتورة؟'))printSale(s.id)}function printSale(id){let s=D.sales.find(x=>x.id===id);if(!s)return;let w=window.open('','_blank');if(!w)return alert('اسمح بفتح نافذة الطباعة من المتصفح.');w.document.write(`<html dir="rtl"><meta charset="utf-8"><title>فاتورة ${s.id}</title><style>body{font-family:Arial;padding:20px}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #ddd;padding:8px;text-align:right}</style><h2>${esc(D.settings.name)}</h2><p>فاتورة #${s.id} — ${esc(s.date)}<br>العميل: ${esc(s.customer||'—')}<br>طريقة الدفع: ${esc(s.method||'—')}</p><table><tr><th>المنتج</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr>${(s.items||[{n:s.n,q:s.q,price:s.price}]).map(i=>`<tr><td>${esc(i.n)}</td><td>${i.q}</td><td>${money(i.price)}</td><td>${money(i.price*i.q)}</td></tr>`).join('')}</table><p>قبل الخصم: ${money(s.subtotal??s.total)}<br>الخصم: ${money(s.discount||0)}<br><b>الإجمالي: ${money(s.total)}</b><br>المدفوع: ${money(s.paid)} — الباقي: ${money(s.change)}</p><script>window.onload=()=>window.print()<\/script></html>`);w.document.close()}
function changes(c){c.innerHTML=`<div class="card"><h2>طلبات تعديل المخزون</h2>${!isManager()?`<p>الموظف يطلب تعديلًا، والكمية لا تتغير إلا بعد موافقة المدير.</p>`:''}${D.requests.slice().reverse().map((r,idx)=>`<div class="product"><span><b>${esc(r.name)}</b> · الكمية المطلوبة: ${r.qty}<br>السبب: ${esc(r.reason)} · ${esc(r.user)} · ${esc(r.date)}<br>الحالة: ${esc(r.status)}${r.note?' — '+esc(r.note):''}</span>${isManager()&&r.status==='معلق'?`<button onclick="decideReq(${D.requests.length-1-idx},true)">موافقة</button><button class="danger" onclick="decideReq(${D.requests.length-1-idx},false)">رفض</button>`:''}</div>`).join('')||'لا توجد طلبات.'}</div>`}function requestStock(id){let p=D.products.find(x=>x.id===id),q=prompt('الكمية الجديدة المطلوبة',p.q);if(q===null)return;q=Number(q);let reason=prompt('سبب التعديل');if(!Number.isInteger(q)||q<0||!reason?.trim())return alert('أدخل كمية صحيحة وسببًا.');D.requests.push({id:D.id++,pid:id,name:p.n,qty:q,reason:reason.trim(),user:me.u,date:stamp(),status:isManager()?'معلق':'معلق'});save();alert('تم إرسال الطلب. لم تتغير الكمية بعد.');page('changes')}function decideReq(i,yes){let r=D.requests[i],p=D.products.find(x=>x.id===r.pid);if(!r||r.status!=='معلق')return;if(yes&&p){let b=p.q;p.q=r.qty;logMove(p,b,p.q,'موافقة المدير: '+r.reason);r.status='مقبول'}else r.status='مرفوض';r.note='قرار '+me.u+' بتاريخ '+stamp();save();page('changes')}
function returnsPage(c){c.innerHTML=`<div class="card"><h2>تسجيل مرتجع أو تالف</h2><label>المنتج</label><select id="rp">${D.products.filter(p=>!p.archived).map(p=>`<option value="${p.id}">${esc(p.n)}</option>`).join('')}</select><label>الكمية</label><input id="rq" type="number" min="1" value="1"><label>النوع</label><select id="rt"><option value="مرتجع">مرتجع عميل — تحت الفحص</option><option value="تالف">تالف</option></select><label>السبب</label><input id="rr" placeholder="سبب المرتجع أو التلف"><button onclick="addReturn()">تسجيل</button><p class="muted">المرتجع لا يرجع للمخزون المتاح تلقائيًا؛ المدير يفحصه ويقرر.</p></div><div class="card"><h2>سجل المرتجعات والتالف</h2>${D.returns.slice().reverse().map((r,idx)=>`<div class="product"><span>${esc(r.name)} × ${r.qty} · ${esc(r.type)}<br>${esc(r.reason)} · الحالة: ${esc(r.status)}<br>${esc(r.date)}</span>${isManager()&&r.status==='تحت الفحص'?`<button onclick="inspectReturn(${D.returns.length-1-idx},'سليم')">إرجاع للمخزون</button><button class="danger" onclick="inspectReturn(${D.returns.length-1-idx},'تالف')">تسجيل كتالف</button>`:''}</div>`).join('')||'لا توجد سجلات.'}</div>`}function addReturn(){let p=D.products.find(x=>x.id===+$('rp').value),q=Number($('rq').value),type=$('rt').value,reason=$('rr').value.trim();if(!p||!Number.isInteger(q)||q<1||!reason)return alert('راجع البيانات.');D.returns.push({pid:p.id,name:p.n,qty:q,type,reason,status:type==='تالف'?'تالف مسجل':'تحت الفحص',date:stamp(),user:me.u});save();page('returns')}function inspectReturn(i,decision){let r=D.returns[i],p=D.products.find(x=>x.id===r.pid);if(!r||!p)return;if(decision==='سليم'){let b=p.q;p.q+=r.qty;logMove(p,b,p.q,'مرتجع سليم بعد الفحص')}r.status=decision==='سليم'?'سليم — أضيف للمخزون':'تالف مسجل';save();page('returns')}
function customers(c){c.innerHTML=`<div class="card"><h2>إضافة عميل / تسجيل دين</h2><input id="cn" placeholder="اسم العميل"><input id="cb" type="number" min="0" value="0" placeholder="مبلغ الدين"><button onclick="addC()">حفظ</button></div><div class="card"><h2>العملاء والديون</h2>${D.customers.map((x,i)=>`<div class="product"><span>${esc(x.n)}<br>المستحق: <b>${money(x.b)}</b></span><button class="secondary" onclick="payC(${i})">تسجيل سداد</button></div>`).join('')||'لا يوجد عملاء.'}</div>`}function addC(){let n=$('cn').value.trim(),b=Number($('cb').value);if(!n||!Number.isFinite(b)||b<0)return alert('راجع البيانات.');let x=D.customers.find(x=>x.n===n);if(x)x.b+=b;else D.customers.push({n,b});save();page('customers')}function payC(i){let v=prompt('مبلغ السداد',D.customers[i].b);if(v===null)return;v=Number(v);if(!Number.isFinite(v)||v<=0)return alert('المبلغ غير صحيح.');D.customers[i].b=Math.max(0,D.customers[i].b-v);save();page('customers')}
function expenses(c){c.innerHTML=`<div class="card"><h2>إضافة مصروف</h2><input id="en" placeholder="وصف المصروف"><input id="ea" type="number" min="0" step=".01" placeholder="المبلغ"><button onclick="addE()">حفظ المصروف</button></div><div class="card"><h2>سجل المصروفات</h2>${D.expenses.slice().reverse().map(x=>`<div class="product">${esc(x.n)}<b>${money(x.a)}</b><span>${esc(x.date)}</span></div>`).join('')||'لا توجد مصروفات.'}</div>`}function addE(){let n=$('en').value.trim(),a=Number($('ea').value);if(!n||$('ea').value===''||!Number.isFinite(a)||a<0)return alert('راجع البيانات.');D.expenses.push({n,a,date:stamp(),user:me.u});save();page('expenses')}
function reports(c){let total=D.sales.reduce((a,s)=>a+s.total,0),profit=D.sales.reduce((a,s)=>a+(s.items||[{price:s.price||0,cost:s.cost||0,q:s.q||0}]).reduce((b,i)=>b+((i.price-i.cost)*i.q),0)-(s.discount||0),0),ex=D.expenses.reduce((a,x)=>a+x.a,0),stock=D.products.filter(p=>!p.archived).reduce((a,p)=>a+p.q*p.cost,0);c.innerHTML=`<div class="grid"><div class="card">إجمالي المبيعات<div class="stats">${money(total)}</div></div><div class="card">ربح تقديري بعد الخصومات<div class="stats">${money(profit)}</div></div><div class="card">إجمالي المصروفات<div class="stats">${money(ex)}</div></div><div class="card">الربح بعد المصروفات<div class="stats">${money(profit-ex)}</div></div><div class="card">قيمة المخزون بسعر الشراء<div class="stats">${money(stock)}</div></div><div class="card">إجمالي الديون<div class="stats">${money(D.customers.reduce((a,x)=>a+x.b,0))}</div></div></div><div class="card"><h2>الفواتير</h2><div class="tablewrap"><table><thead><tr><th>رقم</th><th>التاريخ</th><th>المنتجات</th><th>الخصم</th><th>الإجمالي</th><th>الدفع</th><th>المستخدم</th><th></th></tr></thead><tbody>${D.sales.slice().reverse().map(s=>`<tr><td>${s.id}</td><td>${esc(s.date)}</td><td>${esc(s.items?.map(i=>i.n+' × '+i.q).join('، ')||s.n)}</td><td>${money(s.discount||0)}</td><td>${money(s.total)}</td><td>${esc(s.method||'—')}</td><td>${esc(s.user||'—')}</td><td><button class="secondary" onclick="printSale(${s.id})">طباعة</button></td></tr>`).join('')||'<tr><td colspan="8">لا توجد فواتير.</td></tr>'}</tbody></table></div><button onclick="exportCSV()">تصدير الفواتير CSV</button></div>`}function exportCSV(){let rows=[['رقم الفاتورة','التاريخ','المنتجات','الخصم','الإجمالي','طريقة الدفع'],...D.sales.map(s=>[s.id,s.date,(s.items||[]).map(i=>i.n+' x '+i.q).join(' / '),s.discount||0,s.total,s.method||''])];let csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='مبيعاتي_الفواتير.csv';a.click();URL.revokeObjectURL(a.href)}
function settings(c){c.innerHTML=`<div class="card"><h2>إعدادات البرنامج</h2><label>اسم البرنامج</label><input id="setname" value="${esc(D.settings.name||'مبيعاتي')}"><label>لون الواجهة</label><input id="setcolor" type="color" value="${esc(D.settings.color||'#1769e0')}" style="height:48px"><label>حد تنبيه انخفاض المخزون الافتراضي</label><input id="setlow" type="number" min="0" value="${Number(D.settings.low||5)}"><label>لغة الواجهة</label><select id="setlang"><option value="ar" ${D.settings.lang!=='en'?'selected':''}>العربية</option><option value="en" ${D.settings.lang==='en'?'selected':''}>English (تجريبي)</option></select><button onclick="saveSettings()">حفظ الإعدادات</button><button class="secondary" onclick="D.settings.color='#1769e0';D.settings.lang='ar';save();applyStyle();page('settings')">إعادة اللون واللغة الافتراضيين</button><p class="muted">اختيار الإنجليزية يغيّر اتجاه الصفحة فقط في هذه النسخة التجريبية؛ ترجمة كل العبارات للإنجليزية لم تكتمل بعد.</p></div><div class="card"><h2>تغيير بيانات المدير أو المستخدم الحالي</h2><input id="oldp" type="password" placeholder="كلمة المرور الحالية"><input id="newu" value="${esc(me.u)}" placeholder="اسم المستخدم الجديد"><input id="newp" type="password" placeholder="كلمة المرور الجديدة (4 أحرف على الأقل)"><button onclick="changeLogin()">حفظ بيانات الدخول</button></div>${isManager()?`<div class="card"><h2>إدارة المستخدمين</h2><div class="row"><input id="addun" placeholder="اسم المستخدم"><input id="addpw" type="password" placeholder="كلمة المرور"></div><select id="addrole"><option>موظف</option><option>مدير</option></select><button onclick="addUser()">إضافة مستخدم</button>${D.users.map((u,i)=>`<div class="product">${esc(u.u)} — ${esc(u.r)} ${u.u!==me.u?`<button class="danger" onclick="removeUser(${i})">حذف</button>`:''}</div>`).join('')}</div>`:''}<div class="card"><h2>النسخ الاحتياطي والاستعادة</h2><p class="muted">نزّل نسخة احتياطية واحتفظ بها في مكان آمن. الاستعادة تستبدل بيانات الجهاز الحالي.</p><button onclick="backup()">تنزيل نسخة احتياطية JSON</button><label>اختر ملف نسخة احتياطية</label><input id="bf" type="file" accept=".json,application/json"><button class="secondary" onclick="restore()">استعادة نسخة</button></div>`}function saveSettings(){D.settings.name=$('setname').value.trim()||'مبيعاتي';D.settings.color=$('setcolor').value;D.settings.low=Math.max(0,Number($('setlow').value)||0);D.settings.lang=$('setlang').value;save();applyStyle();page('settings');alert('تم حفظ الإعدادات.')}function changeLogin(){if($('oldp').value!==me.p)return alert('كلمة المرور الحالية غير صحيحة.');let u=$('newu').value.trim(),p=$('newp').value;if(!u||p.length<4)return alert('أدخل اسمًا وكلمة مرور من 4 أحرف على الأقل.');if(D.users.some(x=>x!==me&&x.u===u))return alert('اسم المستخدم مستخدم بالفعل.');let old=me.u;me.u=u;me.p=p;save();$('headuser').textContent=me.u+' — '+me.r;page('settings');alert('تم تغيير بيانات الدخول.')}function addUser(){let u=$('addun').value.trim(),p=$('addpw').value,r=$('addrole').value;if(!u||p.length<4||D.users.some(x=>x.u===u))return alert('راجع اسم المستخدم وكلمة المرور.');D.users.push({u,p,r});save();page('settings')}function removeUser(i){if(!isManager()||D.users[i]===me)return;if(confirm('حذف المستخدم؟')){D.users.splice(i,1);save();page('settings')}}function backup(){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));a.href=url;a.download='مبيعاتي_نسخة_احتياطية.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function restore(){let f=$('bf').files[0];if(!f)return alert('اختر ملف النسخة أولًا.');let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.users)||!Array.isArray(d.products)||!Array.isArray(d.sales))throw 0;if(confirm('استبدال البيانات الحالية بالنسخة المختارة؟')){D=d;D.settings ||= {name:'مبيعاتي',color:'#1769e0',lang:'ar',low:5};save();alert('تمت الاستعادة. سجّل الدخول مرة أخرى.');location.reload()}}catch(e){alert('الملف غير صالح أو غير متوافق.')}};r.readAsText(f)}
applyStyle();
</script></body></html>
